<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Love Letter</title>
        <link
            href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <!-- Hearts Container -->
            <div class="hearts-container" id="heartsContainer">
                <!-- Hearts will be generated by JavaScript -->
            </div>

            <!-- Mailbox -->
            <div class="mailbox-wrapper" id="mailboxWrapper">
                <div class="mailbox" id="mailbox">
                    <img
                        src="images/close.png"
                        alt="closed mailbox"
                        class="mailbox-img closed"
                        id="closedMailbox"
                    />
                    <img
                        src="images/hopopen.png"
                        alt="open mailbox"
                        class="mailbox-img open"
                        id="openMailbox"
                    />
                </div>
            </div>

            <!-- Letter content -->
            <div class="letter" id="letter">
                <div class="corner-hearts">
                    <span class="heart tl">❤</span>
                    <span class="heart tr">❤</span>
                    <span class="heart bl">❤</span>
                    <span class="heart br">❤</span>
                </div>
                <div class="message" id="messageBox" style="font-size: 16px; white-space: pre-wrap; text-align: left;"></div>
            </div>
        </div>

        <!-- Audio element -->
        <audio id="backgroundMusic" loop>
            <source src="./assets/user_bg_music.mp3" type="audio/mpeg" />
            Your browser does not support the audio element.
        </audio>

        <script>
            window.CONFIG = {
                message: `Chúc em yêu 20/10 thật vui vẻ và hạnh phúc nhé ❤️ Mong em luôn xinh đẹp, bình an, gặp nhiều may mắn và luôn được mọi người yêu thương. Anh không mong gì quá lớn lao, chỉ mong em mỗi ngày đều có thể cười thật tươi, sống thật vui và luôn cảm nhận được rằng có anh yêu thương em bằng tất cả sự chân thành. Cảm ơn em vì đã là người yêu của anh. Thương em nhiều lắm, yêu xíu nhiều ! 🥰`
            };
        </script>
        <script src="script.js"></script>
    	<!-- Cơ chế bảo mật (Chống soi code) -->
	<script src="./anti-devtools.js"></script>
</body>
</html>
